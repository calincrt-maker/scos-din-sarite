<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Scos din Sărite cu Serghei — Sezonul 2 | Partnership Pitch Deck</title>
  <meta name="description" content="World-class sponsorship & brand partnership pitch deck for Scos din Sărite cu Serghei Season 2 on Digi24.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- TOP NAVIGATION BAR -->
    <header class="top-nav">
      <div class="brand-ident">
        <span class="brand-badge">DIGI24</span>
        <span class="brand-title">SCOS DIN SĂRITE CU SERGHEI — SEZONUL 2</span>
      </div>
      <div class="nav-controls">
        <button id="btnOverview" class="btn-nav" title="Grid overview (Tasta G)">
          <span>Grid (G)</span>
        </button>
        <button id="btnDownloadPptx" class="btn-nav btn-accent" title="Descarcă prezentarea PowerPoint 16:9">
          <span>📥 PPTX</span>
        </button>
        <button id="btnPrintPdf" class="btn-nav" title="Export PDF">
          <span>📄 PDF</span>
        </button>
        <button id="btnFullscreen" class="btn-nav" title="Ecran complet (Tasta F)">
          <span>Fullscreen</span>
        </button>
      </div>
    </header>

    <!-- FLOATING SIDE DOTS FOR SCROLLING -->
    <div id="sideDotsNav" class="side-dots-nav">
      <!-- Dots rendered dynamically -->
    </div>

    <!-- MAIN SCROLLING VIEWPORT CONTAINER -->
    <main id="viewportContainer" class="viewport-container">
      <!-- All 13 vertical slide sections render dynamically via app.js -->
    </main>

    <!-- BOTTOM FIXED CONTROL BAR -->
    <footer class="bottom-bar">
      <div id="slideCounter" class="slide-counter">SLIDE 01 / 13</div>
      <div class="nav-buttons-group">
        <button id="btnPrev" class="btn-arrow" title="Slide Anterior (Săgeată Sus / Stânga)">&#8593;</button>
        <button id="btnNext" class="btn-arrow" title="Slide Următor (Săgeată Jos / Dreapta)">&#8595;</button>
      </div>
      <div class="progress-track">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </footer>

    <!-- OVERVIEW THUMBNAILS MODAL -->
    <div id="overviewModal" class="overview-modal">
      <div class="overview-header">
        <h2 class="overview-title">Toate Slide-urile (13 Ediții)</h2>
        <button id="btnCloseOverview" class="btn-nav">Închide (Esc)</button>
      </div>
      <div id="overviewGrid" class="overview-grid">
        <!-- Thumbnails rendered dynamically -->
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
